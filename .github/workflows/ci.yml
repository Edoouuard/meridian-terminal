name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  fork:
    name: Golden paths on forks (Aave on Base, bridge from Arbitrum)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Start anvil forks (Base, Arbitrum)
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          ARB_RPC_URL: ${{ secrets.ARB_RPC_URL }}
        run: |
          anvil --fork-url "${BASE_RPC_URL:-https://mainnet.base.org}" --port 8545 --silent &
          anvil --fork-url "${ARB_RPC_URL:-https://arb1.arbitrum.io/rpc}" --port 8546 --silent &
          for port in 8545 8546; do
            ok=0
            for i in $(seq 1 30); do
              if curl -sf -X POST -H 'content-type: application/json' \
                -d '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' http://127.0.0.1:$port >/dev/null; then ok=1; break; fi
              sleep 1
            done
            [ "$ok" = 1 ] || { echo "anvil on $port did not start"; exit 1; }
          done
      - run: npm run test:fork
        env:
          ANVIL_URL: http://127.0.0.1:8545
          ANVIL_ARB_URL: http://127.0.0.1:8546
