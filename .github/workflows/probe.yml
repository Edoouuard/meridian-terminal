name: Probe (temporary)
on:
  push:
    paths: [.github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Pendle API shapes
        run: |
          set -x
          for c in 1 42161 8453; do
            curl -s "https://api-v2.pendle.finance/core/v1/$c/markets/active" -o m$c.json -w "status %{http_code}\n"
            jq -c 'if type=="object" then keys else "array" end' m$c.json
            jq -c '(.markets // .results // .)[0]' m$c.json | head -c 3000; echo
            jq -c '[(.markets // .results // .)[] | {name, address, expiry, pt, underlyingAsset, liq: .details.liquidity, apy: .details.impliedApy}] | sort_by(-(.liq // 0)) | .[0:12]' m$c.json | head -c 4000; echo
          done
          M=$(jq -r '[(.markets // .results // .)[]] | sort_by(-(.details.liquidity // 0)) | map(select((.name // "") | test("USD";"i"))) | .[0].address' m42161.json)
          PT=$(jq -r --arg m "$M" '[(.markets // .results // .)[]] | map(select(.address==$m)) | .[0].pt' m42161.json)
          echo "market=$M pt=$PT"
          USDC=0xaf88d065e77c8cC2239327C5EDb3A432268e5831
          R=0xd8dA6BF26964aF9D7eEd9e03E53415D37aA96045
          curl -s "https://api-v2.pendle.finance/core/v2/sdk/42161/markets/$M/swap?receiver=$R&slippage=0.01&enableAggregator=true&tokenIn=$USDC&tokenOut=${PT#*-}&amountIn=100000000" -w "\nstatus %{http_code}\n" | head -c 3000; echo
          curl -s "https://api-v2.pendle.finance/core/v2/sdk/42161/convert?receiver=$R&slippage=0.01&enableAggregator=true&tokensIn=$USDC&amountsIn=100000000&tokensOut=${PT#*-}" -w "\nstatus %{http_code}\n" | head -c 3000; echo
      - name: Pendle router code
        run: |
          for rpc in https://arb1.arbitrum.io/rpc https://mainnet.base.org https://eth.llamarpc.com; do
            cast code 0x888888888889758F76e7103c6CbF23ABbF58F946 --rpc-url $rpc | head -c 20; echo " $rpc"
          done
      - name: EigenLayer stETH deposit on a mainnet fork
        run: |
          anvil --fork-url https://eth.llamarpc.com --port 8547 --silent &
          sleep 8
          RPC=http://127.0.0.1:8547
          K=0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
          ME=0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266
          SM=0x858646372CC42E1A627fcE94aa7A7033e7CF075A
          ST=0x93c4b944D05dfe6df7645A86cd2206016c51564D
          STETH=0xae7ab96520DE3A18E5e111B5EaAb095312D7fE84
          set -x
          cast call $SM "paused(uint8)(bool)" 0 --rpc-url $RPC || true
          cast call $SM "strategyIsWhitelistedForDeposit(address)(bool)" $ST --rpc-url $RPC || true
          cast call $ST "paused(uint8)(bool)" 0 --rpc-url $RPC || true
          cast call $ST "underlyingToken()(address)" --rpc-url $RPC || true
          cast send $STETH "submit(address)" 0x0000000000000000000000000000000000000000 --value 1ether --private-key $K --rpc-url $RPC >/dev/null
          BAL=$(cast call $STETH "balanceOf(address)(uint256)" $ME --rpc-url $RPC | cut -d' ' -f1); echo "stETH $BAL"
          cast send $STETH "approve(address,uint256)" $SM 500000000000000000 --private-key $K --rpc-url $RPC >/dev/null
          cast send $SM "depositIntoStrategy(address,address,uint256)" $ST $STETH 500000000000000000 --private-key $K --rpc-url $RPC | grep -E "status|gasUsed" || true
          cast call $ST "shares(address)(uint256)" $ME --rpc-url $RPC || true
          cast call $SM "stakerDepositShares(address,address)(uint256)" $ME $ST --rpc-url $RPC || cast call $SM "stakerStrategyShares(address,address)(uint256)" $ME $ST --rpc-url $RPC || true
          DM=0x39053D51B77DC0d36036Fc1fCc8Cb819df8Ef37A
          cast call $DM "delegatedTo(address)(address)" $ME --rpc-url $RPC || true
